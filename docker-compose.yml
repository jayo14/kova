version: "3.9"

# Kova runtime topology:
#
#   frontend  (Next.js)  ── HTTP/WS ──>  backend  (FastAPI API + SSE + WS gateway)
#                                          │
#                                          ├── Celery broker ──> redis (db 1)
#                                          ├── events/frames ──> redis (db 0)
#                                          └── Postgres ──> postgres  (or external RumptyCloud)
#                                          │
#                                          ▼
#                                     kova-worker (Celery, owns Playwright/Chromium)
#
# All three backend services (kova-api, kova-worker, redis) start together with
# `docker compose up`. The backend/.env file overrides any hardcoded defaults
# below, so you can point DATABASE_URL / REDIS_URL / CELERY_BROKER_URL at
# RumptyCloud or any external provider.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI control API: REST + SSE + WebSocket viewport gateway.
  # NEVER launches browsers in worker deployments; Chromium lives in kova-worker.
  kova-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Celery worker: owns Chromium. Each exploration = one isolated browser context.
  # concurrency=2 → at most 2 concurrent Chromium instances (~1-1.5GB RAM each).
  # Scale by raising --concurrency, not by removing the limit.
  kova-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kova-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    # Chromium shutdown plus in-flight task cleanup needs more than the 10s default.
    stop_grace_period: 90s
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # Next.js frontend
  kova-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined into the browser bundle at build time, so
      # runtime `environment:` cannot change them.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      kova-api:
        condition: service_healthy

volumes:
  pgdata:
