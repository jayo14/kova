name: Launch Readiness & Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # Nightly at 02:00 UTC

jobs:
  smoke-and-security:
    name: Production Smoke & Security Audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kova_test
          POSTGRES_USER: kova
          POSTGRES_PASSWORD: kova_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Backend Dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -e "backend/[dev]"

      - name: Run Smoke Test Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://kova:kova_password@localhost:5432/kova_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          scripts/smoke/run_smoke.sh

      - name: Run Security Audit
        run: |
          scripts/smoke/run_security_audit.sh

      - name: Validate Prometheus Alert Rules
        run: |
          # Verify alert rules syntax
          if command -v promtool &> /dev/null; then
            promtool check rules docs/alerts/kova-alerts.yml
          else
            echo "promtool not installed in runner; checking YAML syntax"
            python -c "import yaml; yaml.safe_load(open('docs/alerts/kova-alerts.yml'))"
          fi

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies & Build
        run: |
          pnpm --prefix frontend install
          pnpm --prefix frontend build
