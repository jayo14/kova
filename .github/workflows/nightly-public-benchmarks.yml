name: Nightly Public Demo Smoke
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client and YAML parser
        run: python -m pip install httpx pyyaml
      - name: Probe approved demo pages without following redirects
        run: python -m benchmarks.public_sites --output /tmp/tier_b_public
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: tier-b-public-results
          path: /tmp/tier_b_public.*
