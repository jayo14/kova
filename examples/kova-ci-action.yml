name: Kova Continuous Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL of the deployment to test against'
        required: false
        default: ''
      scope:
        description: 'Validation scope (targeted, expanded, full)'
        required: false
        default: 'targeted'

jobs:
  validate-product-flows:
    name: Continuous Validation & Regression Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect Changed Files
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | tr '\n' ',' | sed 's/,$//' || echo '')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run Kova Continuous Validation
        env:
          KOVA_API_URL: ${{ secrets.KOVA_API_URL || 'https://api.kova.dev' }}
          KOVA_API_TOKEN: ${{ secrets.KOVA_API_TOKEN }}
          KOVA_PROJECT_ID: ${{ secrets.KOVA_PROJECT_ID }}
        run: |
          python3 scripts/kova_ci.py \
            --project-id "$KOVA_PROJECT_ID" \
            --api-token "$KOVA_API_TOKEN" \
            --api-url "$KOVA_API_URL" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --scope "${{ github.event.inputs.scope || 'targeted' }}" \
            --base-url "${{ github.event.inputs.base_url || '' }}" \
            --changed-files "${{ steps.changes.outputs.files }}"
