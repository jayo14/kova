services:
  # ── Backend Control API (FastAPI) ───────────────────────────
  - type: web
    name: kova-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: REDIS_URL
        fromService:
          type: redis
          name: kova-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: kova-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: kova-redis
          property: connectionString

  # ── Celery Worker (Playwright Execution Engine) ────────────
  - type: worker
    name: kova-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: REDIS_URL
        fromService:
          type: redis
          name: kova-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: kova-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: kova-redis
          property: connectionString

  # ── Frontend Web App (Next.js) ─────────────────────────────
  - type: web
    name: kova-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

  # ── Redis (Celery Broker & Event Channel) ──────────────────
  - type: redis
    name: kova-redis
    plan: free
    ipAllowList: []
