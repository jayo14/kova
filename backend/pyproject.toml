[project]
name = "kova-backend"
version = "0.1.0"
description = "Kova autonomous software-use execution platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.2,<6.0",
    "playwright>=1.49,<2.0",
    "httpx>=0.28,<1.0",
    "boto3>=1.34,<2.0",
    "python-dotenv>=1.0,<2.0",
    "itsdangerous>=2.2,<3.0",
    "python-multipart>=0.0.18,<1.0",
    "PyJWT>=2.9,<3.0",
    "cryptography>=44.0,<45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "httpx>=0.28,<1.0",
    "boto3>=1.34,<2.0",
    "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
